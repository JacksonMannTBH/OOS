name: Build

# Validates the application using the same Node version as Netlify.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs on the same ref when a new commit lands —
# avoids burning Actions minutes on superseded commits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder"
          CRON_SECRET: "ci-placeholder"

      # Next.js generates next-env.d.ts (including image declarations) on build.
      - name: Typecheck (root project)
        run: npx tsc --noEmit
