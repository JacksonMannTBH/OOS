<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Out Of Sight — Connection unavailable</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #050607; color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: max(28px, env(safe-area-inset-top)) 28px max(28px, env(safe-area-inset-bottom)); }
      main { max-width: 340px; }
      .brand { color: #f6c431; font-size: 12px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
      h1 { font-size: 32px; line-height: 1.1; margin: 24px 0 16px; }
      p { color: #aaaeb5; line-height: 1.6; }
      a { display: block; margin-top: 28px; padding: 16px; border-radius: 12px; background: #f6c431; color: #050607; text-align: center; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Out Of Sight</div>
      <h1>Connection unavailable</h1>
      <p>We couldn’t load live aircraft information. Check your connection and try again.</p>
      <p>Aircraft status is unavailable until the connection returns.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
